<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff1f5">
  <meta name="description" content="یک بازی عاشقانه و یک سورپرایز اختصاصی">
  <title>Love Quest | یک بازی برای تو ❤️</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="decor decor-one" aria-hidden="true"></div>
  <div class="decor decor-two" aria-hidden="true"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <main class="game-card">
    <header class="game-header">
      <span class="brand">LOVE QUEST <span aria-hidden="true">♡</span></span>
      <span id="progressText" class="progress-text" hidden></span>
    </header>
    <div id="progressTrack" class="progress-track" hidden>
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <section id="welcomeScreen" class="screen" aria-labelledby="welcomeTitle">
      <div class="hero-icon" aria-hidden="true">💌</div>
      <p class="kicker">یه سورپرایز فقط برای تو</p>
      <h1 id="welcomeTitle"></h1>
      <p id="welcomeText" class="description"></p>
      <button id="startButton" class="main-button" type="button">بزن بریم! ❤️</button>
      <p class="small-note">جواب درست هر سؤال، تو رو یک قدم به هدیه نزدیک‌تر می‌کنه.</p>
    </section>

    <section id="questionScreen" class="screen" aria-labelledby="questionText" hidden>
      <div id="stepLabel" class="question-pill"></div>
      <h2 id="questionText" class="question-title"></h2>
      <div id="choices" class="choices"></div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </section>

    <section id="finalScreen" class="screen" aria-labelledby="finalTitle" hidden>
      <div class="hero-icon gift-icon" aria-hidden="true">🎁</div>
      <p class="kicker">تو همه مرحله‌ها رو بردی!</p>
      <h2 id="finalTitle" class="final-title"></h2>
      <figure class="photo-frame">
        <img id="finalImage" src="{{ url_for('static', filename='surprise.jpg') }}" alt="عکس سورپرایز عاشقانه" loading="eager">
        <figcaption>برای قشنگ‌ترین آدم زندگی من ♡</figcaption>
      </figure>
      <p id="finalMessage" class="final-message"></p>
      <button id="restartButton" class="secondary-button" type="button">از اول بازی کنیم ↻</button>
    </section>

    <footer class="footer">made with <span aria-label="love">♥</span></footer>
  </main>

  <script src="{{ url_for('static', filename='content.js') }}"></script>
  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
